spring.application.name=author-service
server.port=8071

# встроенная база H2 в памяти; таблицы создаёт Hibernate, данные — data.sql
spring.datasource.url=jdbc:h2:mem:authors
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# JSON-ответы с отступами — удобно читать в консоли
spring.jackson.serialization.indent-output=true

# /actuator/health для проверки состояния в Docker
management.endpoints.web.exposure.include=health

# адрес соседнего микросервиса для ссылок на книги автора
library.book-service-url=${BOOK_SERVICE_URL:http://localhost:8070}
