spring.application.name=book-service
server.port=8070

# встроенная база H2 в памяти; таблицы создаёт Hibernate, данные — data.sql
spring.datasource.url=jdbc:h2:mem:books
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# JSON-ответы с отступами — удобно читать в консоли
spring.jackson.serialization.indent-output=true

# /actuator/health для проверки состояния в Docker
management.endpoints.web.exposure.include=health

# адрес соседнего микросервиса для ссылки «авторы книги»
library.author-service-url=${AUTHOR_SERVICE_URL:http://localhost:8071}
